id = "azure-apim"
name = "Azure APIM Policies"
version = "0.1.0"
schema_version = 1
authors = ["jcli <jake@jcli.codes>"]
description = "Azure API Management policy XML: C# policy expression highlighting, completion and hover."
repository = "https://github.com/jclicodes/zed-azure-apim"

snippets = ["./snippets/apim expression.json"]

# Completion and hover; the server is bundled into the extension (see server/).
[language_servers.apim-language-server]
name = "APIM Language Server"
languages = ["APIM Policy"]

[grammars.azure_apim]
repository = "https://github.com/jclicodes/tree-sitter-azure-apim"
rev = "1f44d2a42847b34ed2fe6105c38d4e428e1a6a53"

# Bundled so C# expressions are highlighted without the C# extension installed.
# Same revision as zed-extensions/csharp.
[grammars.c_sharp]
repository = "https://github.com/tree-sitter/tree-sitter-c-sharp"
rev = "485f0bae0274ac9114797fc10db6f7034e4086e3"
