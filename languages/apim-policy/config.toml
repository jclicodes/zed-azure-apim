name = "APIM Policy"
grammar = "azure_apim"
# `policy.xml` is the APIOps layout; `*.policy.xml` / `*.fragment.xml` are common
# conventions. Anything else needs a `file_types` entry in settings (see README).
path_suffixes = ["policy.xml", "fragment.xml"]
block_comment = { start = "<!-- ", prefix = "", end = " -->", tab_size = 0 }
wrap_characters = { start_prefix = "<", start_suffix = ">", end_prefix = "</", end_suffix = ">" }
autoclose_before = ">})\"'"
brackets = [
    { start = "<", end = ">", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "(", end = ")", close = true, newline = false, not_in = ["comment"] },
    { start = "{", end = "}", close = true, newline = true, not_in = ["comment"] },
    { start = "!--", end = " --", close = true, newline = false, not_in = ["comment", "string"] },
]
# Policy names are hyphenated; treat them as one word for selection and snippets.
word_characters = ["-"]
completion_query_characters = ["-"]
tab_size = 4
jsx_tag_auto_close = { open_tag_node_name = "start_tag", close_tag_node_name = "end_tag", jsx_element_node_name = "element", tag_name_node_name = "tag_name" }
