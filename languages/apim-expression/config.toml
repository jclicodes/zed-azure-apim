# C# inside APIM policy expressions (`@(...)`, `@{...}`). Hidden: only reached
# through injection from APIM Policy, so it doesn't claim `.cs` files or clash
# with the C# extension, and gets its own snippet scope.
name = "APIM Expression"
grammar = "c_sharp"
hidden = true
line_comments = ["// "]
block_comment = { start = "/* ", prefix = "", end = " */", tab_size = 0 }
autoclose_before = ";:.,=}])>\""
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
tab_size = 4
